name: Deploy Functions

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'workflow/convert_zxu_to_json.py'
      - 'infra/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: rg-divelogsite
  FUNCTION_APP_NAME: func-divelog
  PYTHON_VERSION: '3.11'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Stage function package
        run: |
          mkdir -p ./.deploy/functions
          # Functions コード本体（function_app.py / host.json / requirements.txt 等）
          cp -r functions/. ./.deploy/functions/
          # convert_zxu_to_json.py をフラット配置で同梱
          # （function_app.py から `import convert_zxu_to_json` で参照可能にする）
          cp workflow/convert_zxu_to_json.py ./.deploy/functions/

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Reconcile deployment storage access
        run: |
          deployment_storage_url=$(az functionapp show \
            --name "${{ env.FUNCTION_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query properties.functionAppConfig.deployment.storage.value \
            --output tsv)
          storage_account=$(echo "$deployment_storage_url" | sed -E 's#https://([^.]+)\..*#\1#')
          storage_account_id=$(az storage account show \
            --name "$storage_account" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query id \
            --output tsv)

          # 管理 Policy の対象外タグを先に復元してから、Kudu が app-package へ
          # 到達するための公開エンドポイントを Bicep の宣言値へ戻す。
          az tag update \
            --resource-id "$storage_account_id" \
            --operation Merge \
            --tags SecurityControl=Ignore \
            --output none
          az storage account update \
            --name "$storage_account" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --public-network-access Enabled \
            --default-action Allow \
            --output none

          storage_state=$(az storage account show \
            --name "$storage_account" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query "{publicNetworkAccess:publicNetworkAccess,defaultAction:networkRuleSet.defaultAction,securityControl:tags.SecurityControl,allowSharedKeyAccess:allowSharedKeyAccess}" \
            --output json)
          echo "$storage_state"
          if [ "$(echo "$storage_state" | jq -r '.publicNetworkAccess')" != "Enabled" ] || \
             [ "$(echo "$storage_state" | jq -r '.defaultAction')" != "Allow" ] || \
             [ "$(echo "$storage_state" | jq -r '.securityControl')" != "Ignore" ] || \
             [ "$(echo "$storage_state" | jq -r '.allowSharedKeyAccess')" != "false" ]; then
            echo "Deployment storage access does not match the required secure configuration."
            exit 1
          fi

      - name: Deploy to Azure Functions
        run: |
          cd ./.deploy/functions
          subscription_id=$(az account show --query id -o tsv)
          deployment_storage_url=$(az functionapp show \
            --name "${{ env.FUNCTION_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query properties.functionAppConfig.deployment.storage.value \
            --output tsv)
          storage_account=$(echo "$deployment_storage_url" | sed -E 's#https://([^.]+)\..*#\1#')
          package_modified_before=$(az storage blob show \
            --account-name "$storage_account" \
            --container-name app-package \
            --name released-package.zip \
            --auth-mode login \
            --query properties.lastModified \
            --output tsv 2>/dev/null || true)

          # Core Tools はデプロイ完了後にメインサイトへ疎通確認するが、この Function App は
          # HTTP トリガーを持たず ipSecurityRestrictions で全拒否しているため 403 になる。
          # 公開結果はパッケージ更新時刻と後続の ARM trigger sync で検証する。
          set +e
          az account get-access-token \
            --resource https://management.azure.com/ \
            --output json \
            | npx --yes azure-functions-core-tools@4.13.0 azure functionapp publish "${{ env.FUNCTION_APP_NAME }}" \
                --python \
                --build remote \
                --subscription "$subscription_id" \
                --access-token-stdin
          pipeline_status=("${PIPESTATUS[@]}")
          set -e

          if [ "${pipeline_status[0]}" -ne 0 ]; then
            echo "Failed to acquire the Azure management token."
            exit "${pipeline_status[0]}"
          fi
          if [ "${pipeline_status[1]}" -ne 0 ]; then
            echo "Azure Functions Core Tools failed to publish the package."
            exit "${pipeline_status[1]}"
          fi

          package_modified_after=$(az storage blob show \
            --account-name "$storage_account" \
            --container-name app-package \
            --name released-package.zip \
            --auth-mode login \
            --query properties.lastModified \
            --output tsv)
          if [ -z "$package_modified_after" ] || [ "$package_modified_before" = "$package_modified_after" ]; then
            echo "The Functions deployment package was not updated."
            exit 1
          fi

          function_app_id=$(az functionapp show \
            --name "${{ env.FUNCTION_APP_NAME }}" \
            --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
            --query id \
            --output tsv)
          az rest \
            --method post \
            --url "https://management.azure.com${function_app_id}/syncfunctiontriggers?api-version=2024-04-01"
